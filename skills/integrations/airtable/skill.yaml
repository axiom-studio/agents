apiVersion: axiom.studio/v1
kind: Skill
metadata:
  id: airtable
  name: Airtable Integration
  description: Read and write data to Airtable bases and tables
  version: 1.0.0
  author: Axiom Studio
  authorEmail: engineering@axiomstudio.ai
  category: integration
  tags: [airtable, database, cms, integration]
spec:
  nodeTypes:
    - type: airtable-read
      name: Read Airtable Records
      description: Fetch records from an Airtable table
      icon: ic-database
      config:
        - key: baseId
          label: Base ID
          type: text
          required: true
        - key: tableId
          label: Table ID / Name
          type: text
          required: true
        - key: filterFormula
          label: Filter Formula
          type: text
          required: false
    - type: airtable-write
      name: Write Airtable Record
      description: Create or update a record in Airtable
      icon: ic-database
      config:
        - key: baseId
          label: Base ID
          type: text
          required: true
        - key: tableId
          label: Table ID / Name
          type: text
          required: true
