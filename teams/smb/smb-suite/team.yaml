apiVersion: axiom.studio/v1
kind: TeamBlueprint
metadata:
  id: smb-suite
  name: SMB Operations Suite
  description: Complete team for small business operations covering accounting, sales, and customer support
  version: 1.0.0
  author: Axiom Studio
  authorEmail: engineering@axiomstudio.ai
  category: business
  tags: [smb, team, operations, suite]
spec:
  task: "Manage daily SMB operations including accounting, sales, and customer support"
  members:
    - name: accountant
      role: finance-lead
      agentRef:
        url: https://raw.githubusercontent.com/axiomstudio/agents/main/agents/smb/accountant/agent.yaml
      skillOverrides:
        - skillUrl: https://raw.githubusercontent.com/axiom-studio/skills/main/integrations/quickbooks/skill.yaml
          access: admin
    - name: sales-assistant
      role: sales-lead
      agentRef:
        url: https://raw.githubusercontent.com/axiomstudio/agents/main/agents/smb/sales-assistant/agent.yaml
    - name: support
      role: support-lead
      agentRef:
        url: https://raw.githubusercontent.com/axiomstudio/agents/main/agents/smb/customer-support/agent.yaml
  context:
    businessType: "small-business"
    escalationPolicy: "escalate-to-human-after-3-attempts"
